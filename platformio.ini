; PlatformIO Project Configuration File
; 光伏逆变器 WiFi 通讯模块 — ESP32-C3 / ESP8266

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = COM7
board_build.flash_mode = dio
board_build.partitions = partitions_arduino_4mb.csv
; USB CDC 虚拟串口（Serial = USB CDC, Serial1 = GPIO0/1 连接 ARM）
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DUSB_MANUFACTURER="辰烁科技"
    -DUSB_PRODUCT="光伏逆变器WiFi模块"
    ; 使用 NimBLE 替代 Bluedroid（体积小 10 倍）
    -DCONFIG_BT_NIMBLE_ENABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.2
    h2zero/NimBLE-Arduino@^1.4.0

; 如需编译 ESP8266 版本，取消注释下面:
; [env:esp8266]
; platform = espressif8266
; board = esp07s
; framework = arduino
; monitor_speed = 115200
; lib_deps =
;     knolleary/PubSubClient@^2.8
;     bblanchon/ArduinoJson@^6.21.2
