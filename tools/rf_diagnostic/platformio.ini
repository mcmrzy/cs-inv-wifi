; ESP32-C2 RF Diagnostic Tool (ESP-IDF framework)
; Build: pio run
; Flash: pio run -t upload --upload-port COM11
; Monitor: pio device monitor -b 115200

[env:esp32c2]
platform = espressif32
board = esp32-c3-devkitm-1   ; C2 板型未收录，用 C3 兼容编译，idf.py target 设 esp32c2
framework = espidf
monitor_speed = 115200
upload_speed = 115200
board_build.flash_mode = dio
board_build.partitions = default.csv
